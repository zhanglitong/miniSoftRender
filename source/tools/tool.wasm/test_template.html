<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>WASM Test</title>
</head>
<body>
    <h1>WASM 单元测试</h1>
    <div id="output"></div>

    {{{ SCRIPT }}}

    <script>
        MyModule().then(function(module) {
            try {
                const greeting = module.greet("World");
                const numbers = module.get_numbers();
                const first = numbers.get(0);
                const size = numbers.size();

                document.getElementById('output').innerHTML = `
                    <p>greet: ${greeting}</p>
                    <p>get_numbers().get(0): ${first}</p>
                    <p>get_numbers().size(): ${size}</p>
                `;
            } catch (err) {
                console.error('Wasm 调用失败:', err);
                document.getElementById('output').textContent = '调用失败，请查看控制台。';
            }
        }).catch(function(err) {
            console.error('Wasm 加载失败:', err);
            document.getElementById('output').textContent = err;
        });
    </script>
</body>
</html>
