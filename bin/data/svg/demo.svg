<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- 背景:圆角矩形 -->
  <rect x="16" y="16" width="480" height="480" rx="64" fill="#0F172A"/>

  <!-- 圆环:两条子路径形成洞 -->
  <path d="M 256 76 A 180 180 0 1 1 255.9 76 Z M 256 136 A 120 120 0 1 0 256.1 136 Z" fill="#38BDF8"/>

  <!-- 五角星:polygon 填充 -->
  <polygon points="256,125 266,151 294,153 272,170 280,197 256,182 232,197 240,170 218,153 246,151" fill="#FBBF24"/>

  <!-- 心形:path + 三次贝塞尔曲线 -->
  <path d="M 256 412 C 196 352 148 312 148 262 C 148 222 178 200 210 200 C 232 200 248 212 256 228 C 264 212 280 200 302 200 C 334 200 364 222 364 262 C 364 312 316 352 256 412 Z" fill="#F472B6"/>

  <!-- 描边波浪:仅描边,无填充 -->
  <path d="M 80 452 C 144 404 176 500 240 452 C 304 404 336 500 400 452" fill="none" stroke="#A78BFA" stroke-width="10"/>

  <!-- 变换与描边测试:组变换 + 圆角矩形描边 -->
  <g transform="translate(72 72) rotate(20)">
    <rect x="0" y="0" width="48" height="48" rx="10" fill="#22C55E" stroke="#FFFFFF" stroke-width="4"/>
  </g>
</svg>
